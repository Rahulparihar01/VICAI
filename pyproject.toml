[project]
name = "vicai-api"
version = "0.1.0"
description = "FastAPI backend for VicAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pyjwt>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
    "stripe>=15.3.1",
]

[dependency-groups]
dev = [
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
